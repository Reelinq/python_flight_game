<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/game_start.css">
</head>
<body class="page page-settings">
  <main class="content settings">
    <header class="page-header">
      <a class="buttons exit_button" href="/ui/">Exit</a>
    </header>
    <h1 class="title">Settings</h1>

    <details class="card accordion">
      <summary class="buttons accordion-toggle">Choose your budget manually</summary>
      <div class="accordion-body">
        <label class="label" for="co2-budget">Enter initial CO2 budget:</label>
        <input class="input" id="co2-budget" type="number" name="co2Budget" placeholder="e.g. 1000">

        <label class="label" for="co2-unit">Choose CO2 consumption unit:</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="co2Unit" value="per100" checked>
            <span>Per 100km</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="co2Unit" value="per1">
            <span>Per km</span>
          </label>
        </div>
      </div>
    </details>

    <button class="buttons secondary" type="button">Randomize budget and CO2 rate</button>
  </main>
</body>
</html>
